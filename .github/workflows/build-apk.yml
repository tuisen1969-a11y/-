- name: Install dependencies
  run: |
    sudo apt update

    sudo apt install -y \
      git zip unzip \
      openjdk-17-jdk \
      python3-pip \
      autoconf automake \
      libtool pkg-config \
      cmake \
      libffi-dev \
      libssl-dev

    pip install --upgrade pip
    pip install buildozer cython
